name: 工程质量检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: mousehole
          POSTGRES_PASSWORD: mousehole-ci-only
          POSTGRES_DB: mousehole_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mousehole -d mousehole_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      MOUSEHOLE_MODE: development
      MOUSEHOLE_DATABASE_URL: postgres://mousehole:mousehole-ci-only@127.0.0.1:55432/mousehole_test?sslmode=disable
      MOUSEHOLE_TEST_DATABASE_URL: postgres://mousehole:mousehole-ci-only@127.0.0.1:55432/mousehole_test?sslmode=disable
      MOUSEHOLE_LISTEN_ADDR: 127.0.0.1:8080
      MOUSEHOLE_PUBLIC_URL: http://127.0.0.1:8080
      MOUSEHOLE_WEB_ORIGIN: http://127.0.0.1:5173
      MOUSEHOLE_OIDC_ISSUER: http://127.0.0.1:9090
      MOUSEHOLE_OIDC_CLIENT_ID: mousehole-local
      MOUSEHOLE_OIDC_CLIENT_SECRET: mousehole-local-secret
      MOUSEHOLE_AUTH_KEY: bW91c2Vob2xlLWxvY2FsLWF1dGgta2V5LTMyYnl0ZXM=
      MOUSEHOLE_TEST_OIDC_LISTEN_ADDR: 127.0.0.1:9090
      MOUSEHOLE_TEST_OIDC_SUBJECT: mousehole-local-analyst
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 按锁文件安装前端依赖
        run: pnpm --dir web install --frozen-lockfile
      - name: 静态、生成漂移、单元及真实数据库检查
        run: python scripts/check.py --integration --race
      - name: 显式迁移与全进程重启检查
        run: |
          python scripts/dev.py migrate
          python scripts/verify_restart.py
      - name: 安装端到端浏览器
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: 启动 API 并执行真实浏览器检查
        run: |
          mkdir -p .local/bin
          (cd backend && go build -o ../.local/bin/api ./cmd/api)
          (cd backend && go build -o ../.local/bin/admin ./cmd/admin)
          (cd backend && go build -o ../.local/bin/test-oidc ./cmd/test-oidc)
          .local/bin/test-oidc > .local/oidc.log 2>&1 &
          oidc_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9090/.well-known/openid-configuration > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9090/.well-known/openid-configuration
          .local/bin/admin provision-user \
            --database-url "$MOUSEHOLE_DATABASE_URL" \
            --issuer "$MOUSEHOLE_OIDC_ISSUER" \
            --subject "$MOUSEHOLE_TEST_OIDC_SUBJECT" \
            --user-id 10000000-0000-4000-8000-000000000001 \
            --display-name CI分析员 \
            --project-id 10000000-0000-4000-8000-000000000002 \
            --project-name CI评估项目 \
            --role analyst
          .local/bin/api > .local/api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" "$oidc_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/healthz
          MOUSEHOLE_E2E_ADMIN_BIN="$PWD/.local/bin/admin" pnpm --dir web e2e
      - name: 保留失败诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 检查失败诊断
          path: |
            web/test-results/
            web/playwright-report/
            .local/api.log
            .local/oidc.log
          if-no-files-found: ignore
