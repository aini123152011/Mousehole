openapi: 3.1.0
info:
  title: Mousehole 企业身份与草稿命令 API
  version: 0.2.0
  description: '单企业私有化部署的 OIDC 登录、服务端会话、项目成员访问和任务草稿命令接口。

    浏览器只持有 HttpOnly Cookie；OIDC token 不下发到浏览器。已受理只表示草稿持久化。

    '
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: auth
    description: 企业 OIDC 登录与服务端会话
  - name: commands
    description: 项目内草稿命令受理与恢复查询
paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
        - auth
      summary: 检查进程存活
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
  /api/v1/auth/login:
    get:
      operationId: startLogin
      tags:
        - auth
      summary: 发起企业 OIDC 登录
      description: 浏览器导航到此地址；服务端保存一次性 state、nonce 和 PKCE，不返回 token。
      responses:
        '302':
          description: 重定向到 OIDC authorization endpoint
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/callback:
    get:
      operationId: completeLogin
      tags:
        - auth
      summary: 完成企业 OIDC 回调
      description: 校验 state、登录绑定 Cookie、PKCE、nonce、issuer、签名、audience 和 azp。
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '303':
          description: 登录成功并重定向到 Web 应用
        '400':
          description: 登录尝试无效或已消费；返回不含 code、token 或 claims 的中文安全页
          content:
            text/html:
              schema:
                type: string
        '403':
          description: 外部身份未预置；返回中文安全页和 request_id
          content:
            text/html:
              schema:
                type: string
        '503':
          description: 身份依赖暂不可用；返回不含底层错误的中文安全页
          content:
            text/html:
              schema:
                type: string
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      summary: 撤销当前服务端会话
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: 会话已撤销并清除 Cookie
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFInvalid'
  /api/v1/session:
    get:
      operationId: getSession
      tags:
        - auth
      summary: 查询当前用户和项目能力
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前会话投影和内存 CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/projects/{project_id}/commands/{command_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/CommandID'
    put:
      operationId: acceptCommand
      tags:
        - commands
      summary: 受理创建任务草稿命令
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskDraftCommand'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '201':
          description: 首次受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 项目成员、角色或 CSRF 校验拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          $ref: '#/components/responses/CommandNotFound'
        '409':
          description: 同 ID 参数冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '413':
          description: 请求体超过 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '415':
          description: 媒体类型错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: getCommandReceipt
      tags:
        - commands
      summary: 查询当前用户原命令受理结果
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 项目无权访问
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          $ref: '#/components/responses/CommandNotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/projects/{project_id}/assets:
    get:
      operationId: listAssets
      summary: 读取项目资产及本项目来源
      description: 当前活动项目成员可读取；写请求要求 analyst、会话绑定 CSRF 和精确来源。预检查仅本地匹配，历史结果不作为执行许可。
      security:
        - sessionCookie: []
      parameters:
        - &id001
          $ref: '#/components/parameters/ProjectID'
        - &id004
          name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - &id005
          name: cursor
          in: query
          schema: &id007
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - domain
              - ip
              - url
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: 读取项目资产及本项目来源
          content:
