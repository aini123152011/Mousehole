components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-mousehole_session
      description: 生产 Cookie 名称；开发模式使用显式 loopback Cookie 名称。
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      description: 项目 UUID；最终权限由当前活动成员关系决定。
      schema:
        $ref: '#/components/schemas/UUID'
    CommandID:
      name: command_id
      in: path
      required: true
      description: 客户端生成并在未知结果时保留的稳定命令 UUID。
      schema:
        $ref: '#/components/schemas/UUID'
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      description: 从当前 session 响应取得的会话绑定 token；不得持久化。
      schema:
        type: string
        minLength: 32
  schemas:
    UUID:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    ProjectAccess:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - role
        - capabilities
        - version
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
          minLength: 1
          maxLength: 120
        role:
          type: string
          enum:
            - viewer
            - analyst
        capabilities:
          type: array
          items:
            type: string
            enum:
              - project:read
              - task_draft:create
              - asset:import
              - authorization:create
              - policy:precheck
        version:
          type: string
          pattern: ^[1-9][0-9]*$
    Session:
      type: object
      additionalProperties: false
      required:
        - actor_id
        - display_name
        - email
        - projects
        - csrf_token
        - expires_at
      properties:
        actor_id:
          $ref: '#/components/schemas/UUID'
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type:
            - string
            - 'null'
          format: email
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAccess'
        csrf_token:
          type: string
          minLength: 32
        expires_at:
          type: string
          format: date-time
          pattern: Z$
    CreateTaskDraftCommand:
      type: object
      additionalProperties: false
      required:
        - kind
        - payload
      properties:
        kind:
          type: string
          const: create_task_draft
        payload:
          type: object
          additionalProperties: false
          required:
            - title
          properties:
            title:
              type: string
              description: 去除首尾 Unicode 空白后为 1–120 个 Unicode 字符。
    CommandReceipt:
      type: object
      additionalProperties: false
      required:
        - command_id
        - project_id
        - kind
        - state
        - task_id
        - task_title
        - task_state
        - version
        - accepted_at
      properties:
        command_id:
          $ref: '#/components/schemas/UUID'
        project_id:
          $ref: '#/components/schemas/UUID'
        kind:
          type: string
          const: create_task_draft
        state:
          type: string
          const: accepted
        task_id:
          $ref: '#/components/schemas/UUID'
        task_title:
          type: string
          minLength: 1
          maxLength: 120
        task_state:
          type: string
          const: draft
        version:
          type: string
          const: '1'
        accepted_at:
          type: string
          format: date-time
          pattern: Z$
    APIError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - unauthenticated
            - session_expired
            - identity_not_provisioned
            - csrf_invalid
            - project_forbidden
            - origin_forbidden
            - command_not_found
            - idempotency_conflict
            - request_too_large
            - unsupported_media_type
            - service_unavailable
            - internal_error
            - route_not_found
            - method_not_allowed
            - forbidden
            - not_found
            - command_conflict
            - policy_revision_conflict
            - unavailable
        message:
          type: string
        request_id:
          $ref: '#/components/schemas/UUID'
        validation_errors:
          type: array
          minItems: 1
          maxItems: 100
          description: 仅范围 invalid_request 可提供；字段使用 payload.entries.0.value 等固定点路径，消息为受控中文规范化说明，不含原始请求或依赖错误。
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - message
            properties:
              field:
                type: string
                minLength: 1
                maxLength: 200
              message:
                type: string
                minLength: 1
                maxLength: 500
    AssetInput:
      type: object
      additionalProperties: false
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - domain
            - ip
            - url
        value:
          type: string
          minLength: 1
          maxLength: 2048
    AssetImportPayload:
      type: object
      additionalProperties: false
      required:
        - entries
        - source
        - notes
        - external_ref
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AssetInput'
          minItems: 1
          maxItems: 100
        source:
          type: string
          enum:
            - manual
            - api_import
        notes:
          type: string
          maxLength: 500
        external_ref:
          type: string
          maxLength: 500
    AssetSource:
      type: object
      additionalProperties: false
      required:
        - command_id
        - source
        - notes
        - external_ref
        - created_at
      properties:
        command_id: *id006
        source:
          type: string
          enum:
            - manual
            - api_import
        notes: *id007
        external_ref: *id007
        created_at: &id008
          type: string
          format: date-time
          pattern: Z$
    Asset:
      type: object
