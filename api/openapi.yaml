        - project_id
        - kind
        - state
        - accepted_at
        - result
      properties:
        command_id: *id006
        project_id: *id012
        kind:
          type: string
          enum:
            - import_assets
            - create_authorization_version
            - precheck_target
            - activate_authorization_version
            - revoke_authorization_version
            - add_scope_deny
            - revoke_scope_deny
        state:
          type: string
          const: accepted
        accepted_at: *id008
        result:
          oneOf:
            - $ref: '#/components/schemas/AssetImportResult'
            - $ref: '#/components/schemas/AuthorizationVersionResult'
            - $ref: '#/components/schemas/PrecheckResult'
            - $ref: '#/components/schemas/PolicyChangeResult'
    AssetPage:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
        - next_cursor
        - page_count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        has_more:
          type: boolean
        next_cursor:
          type:
            - string
            - 'null'
        page_count: *id009
    AuthorizationVersionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
        - next_cursor
        - page_count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationVersion'
        has_more:
          type: boolean
        next_cursor:
          type:
            - string
            - 'null'
        page_count: *id009
    PrecheckPage:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
        - next_cursor
        - page_count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PolicyDecision'
        has_more:
          type: boolean
        next_cursor:
          type:
            - string
            - 'null'
        page_count: *id009
  responses:
    Receipt:
      description: 原命令持久化回执
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandReceipt'
    InvalidRequest:
      description: 请求无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
    Unauthenticated:
      description: 未登录或会话已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
    IdentityNotProvisioned:
      description: 外部身份未预置
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
    CSRFInvalid:
      description: CSRF 或来源校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
    CommandNotFound:
      description: 当前 actor 未查询到原命令
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
    Unavailable:
      description: 依赖失败或结果待确认
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
