openapi: 3.1.0
info:
  title: Mousehole 企业身份与草稿命令 API
  version: 0.2.0
  description: |
    单企业私有化部署的 OIDC 登录、服务端会话、项目成员访问和任务草稿命令接口。
    浏览器只持有 HttpOnly Cookie；OIDC token 不下发到浏览器。已受理只表示草稿持久化。
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: auth
    description: 企业 OIDC 登录与服务端会话
  - name: commands
    description: 项目内草稿命令受理与恢复查询
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [auth]
      summary: 检查进程存活
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /api/v1/auth/login:
    get:
      operationId: startLogin
      tags: [auth]
      summary: 发起企业 OIDC 登录
      description: 浏览器导航到此地址；服务端保存一次性 state、nonce 和 PKCE，不返回 token。
      responses:
        '302': { description: 重定向到 OIDC authorization endpoint }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/auth/callback:
    get:
      operationId: completeLogin
      tags: [auth]
      summary: 完成企业 OIDC 回调
      description: 校验 state、登录绑定 Cookie、PKCE、nonce、issuer、签名、audience 和 azp。
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '303': { description: 登录成功并重定向到 Web 应用 }
        '400':
          description: 登录尝试无效或已消费；返回不含 code、token 或 claims 的中文安全页
          content: { text/html: { schema: { type: string } } }
        '403':
          description: 外部身份未预置；返回中文安全页和 request_id
          content: { text/html: { schema: { type: string } } }
        '503':
          description: 身份依赖暂不可用；返回不含底层错误的中文安全页
          content: { text/html: { schema: { type: string } } }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 撤销当前服务端会话
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: 会话已撤销并清除 Cookie }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CSRFInvalid' }
  /api/v1/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: 查询当前用户和项目能力
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 当前会话投影和内存 CSRF token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/projects/{project_id}/commands/{command_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectID' }
      - { $ref: '#/components/parameters/CommandID' }
    put:
      operationId: acceptCommand
      tags: [commands]
      summary: 受理创建任务草稿命令
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateTaskDraftCommand' } }
      responses:
        '200': { $ref: '#/components/responses/Receipt' }
        '201':
          {
            description: 首次受理,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/CommandReceipt' } } },
          }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: 项目成员、角色或 CSRF 校验拒绝
          content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
        '404': { $ref: '#/components/responses/CommandNotFound' }
        '409':
          {
            description: 同 ID 参数冲突,
            content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } },
          }
        '413':
          {
            description: 请求体超过 16 KiB,
            content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } },
          }
        '415':
          {
            description: 媒体类型错误,
            content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } },
          }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      operationId: getCommandReceipt
      tags: [commands]
      summary: 查询当前用户原命令受理结果
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Receipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          {
            description: 项目无权访问,
            content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } },
          }
        '404': { $ref: '#/components/responses/CommandNotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-mousehole_session
      description: 生产 Cookie 名称；开发模式使用显式 loopback Cookie 名称。
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      description: 项目 UUID；最终权限由当前活动成员关系决定。
      schema: { $ref: '#/components/schemas/UUID' }
    CommandID:
      name: command_id
      in: path
      required: true
      description: 客户端生成并在未知结果时保留的稳定命令 UUID。
      schema: { $ref: '#/components/schemas/UUID' }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      description: 从当前 session 响应取得的会话绑定 token；不得持久化。
      schema: { type: string, minLength: 32 }
  schemas:
    UUID:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    ProjectAccess:
      type: object
      additionalProperties: false
      required: [id, name, role, capabilities, version]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string, minLength: 1, maxLength: 120 }
        role: { type: string, enum: [viewer, analyst] }
        capabilities:
          type: array
          items: { type: string, enum: ['project:read', 'task_draft:create'] }
        version: { type: string, pattern: '^[1-9][0-9]*$' }
    Session:
      type: object
      additionalProperties: false
      required: [actor_id, display_name, email, projects, csrf_token, expires_at]
      properties:
        actor_id: { $ref: '#/components/schemas/UUID' }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: [string, 'null'], format: email }
        projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectAccess' }
        csrf_token: { type: string, minLength: 32 }
        expires_at: { type: string, format: date-time, pattern: 'Z$' }
    CreateTaskDraftCommand:
      type: object
      additionalProperties: false
      required: [kind, payload]
      properties:
        kind: { type: string, const: create_task_draft }
        payload:
          type: object
          additionalProperties: false
          required: [title]
          properties:
            title: { type: string, description: 去除首尾 Unicode 空白后为 1–120 个 Unicode 字符。 }
    CommandReceipt:
      type: object
      additionalProperties: false
      required:
        [command_id, project_id, kind, state, task_id, task_title, task_state, version, accepted_at]
      properties:
        command_id: { $ref: '#/components/schemas/UUID' }
        project_id: { $ref: '#/components/schemas/UUID' }
        kind: { type: string, const: create_task_draft }
        state: { type: string, const: accepted }
        task_id: { $ref: '#/components/schemas/UUID' }
        task_title: { type: string, minLength: 1, maxLength: 120 }
        task_state: { type: string, const: draft }
        version: { type: string, const: '1' }
        accepted_at: { type: string, format: date-time, pattern: 'Z$' }
    APIError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum:
            [
              invalid_request,
              unauthenticated,
              session_expired,
              identity_not_provisioned,
              csrf_invalid,
              project_forbidden,
              origin_forbidden,
              command_not_found,
              idempotency_conflict,
              request_too_large,
              unsupported_media_type,
              service_unavailable,
              internal_error,
              route_not_found,
              method_not_allowed,
            ]
        message: { type: string }
        request_id: { $ref: '#/components/schemas/UUID' }
  responses:
    Receipt:
      description: 原命令持久化回执
      content: { application/json: { schema: { $ref: '#/components/schemas/CommandReceipt' } } }
    InvalidRequest:
      description: 请求无效
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
    Unauthenticated:
      description: 未登录或会话已失效
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
    IdentityNotProvisioned:
      description: 外部身份未预置
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
    CSRFInvalid:
      description: CSRF 或来源校验失败
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
    CommandNotFound:
      description: 当前 actor 未查询到原命令
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
    Unavailable:
      description: 依赖失败或结果待确认
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
